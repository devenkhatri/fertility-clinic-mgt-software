services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-ivf-app:latest
    container_name: aura_ivf_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-AURA IVF}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ivf}"
      DB_USERNAME: "${DB_USERNAME:-ivf_user}"
      DB_PASSWORD: "${DB_PASSWORD:-ivf_secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: "${CACHE_STORE:-database}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aura_network

  nginx:
    image: nginx:1.27-alpine
    container_name: aura_ivf_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aura_network

  db:
    image: mysql:8.0
    container_name: aura_ivf_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ivf}"
      MYSQL_USER: "${DB_USERNAME:-ivf_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ivf_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - aura_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - aura_network

  redis:
    image: redis:7-alpine
    container_name: aura_ivf_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - aura_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aura_network

volumes:
  aura_db_data:
    driver: local
  aura_redis_data:
    driver: local

networks:
  aura_network:
    driver: bridge
